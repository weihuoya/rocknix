name: Build Docker Image

on:
  workflow_call:
    inputs:
      OWNER_LC:
        description: "repo owner name"
        type: string
        required: true
jobs:
  build-docker-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Pull upstream builder image (fork)
        if: ${{ github.repository_owner != 'ROCKNIX' }}
        run: docker pull ghcr.io/rocknix/rocknix-build:latest

      - name: Login to GHCR
        if: ${{ github.repository_owner == 'ROCKNIX' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (upstream)
        if: ${{ github.repository_owner == 'ROCKNIX' && github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
