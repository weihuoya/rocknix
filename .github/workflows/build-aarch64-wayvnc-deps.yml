name: Build wayvnc-deps for ROCKNIX

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      DEVICE:
        required: false
        type: string
        default: 'SM8550'
  push:
    branches: [main]
    paths:
      - 'packages/graphics/mesa/**/package.mk'
      - 'projects/ROCKNIX/packages/graphics/mesa/**/package.mk'
      - 'packages/multimedia/ffmpeg/**/package.mk'
      - 'projects/ROCKNIX/packages/multimedia/ffmpeg/**/package.mk'

jobs:
  build-aarch64-wayvnc-deps:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      JAVA_HOME: /usr
      PROJECT: ROCKNIX
      DEVICE: ${{ inputs.DEVICE || 'SM8550' }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ env.DEVICE }}-wayvnc-deps-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ env.DEVICE }}-wayvnc-deps-

      - name: Download and extract fixed aarch64-toolchain
        run: |
          ASSET="toolchain-aarch64-SM8550-2718568bd983a54f.tar.zst"
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/toolchain-aarch64-SM8550"
          curl -L --fail --silent --show-error "${URL_BASE}/${ASSET}.aa" -o "${ASSET}.aa"
          curl -L --fail --silent --show-error "${URL_BASE}/${ASSET}.ab" -o "${ASSET}.ab"
          cat "${ASSET}.aa" "${ASSET}.ab" > "${ASSET}"
          rm -f "${ASSET}.aa" "${ASSET}.ab"
          tar --zstd -xf "${ASSET}"
          rm -f "${ASSET}"

      - name: Snapshot host toolchain before ashell-deps
        run: |
          # The deps cache must include host toolchain artifacts installed by
          # ashell-deps and by the packages built here, so that downstream
          # wayvnc builds can reuse them. Record the set of files/symlinks
          # present before extracting ashell-deps, then package only the
          # newly added paths afterwards.
          find "build.ROCKNIX-${{ env.DEVICE }}.aarch64/toolchain" \( -type f -o -type l \) | \
            LC_ALL=C sort > toolchain-before.txt

      - name: Download ashell-deps
        run: |
          ASSET="deps-aarch64-${{ env.DEVICE }}.tar.zst"
          URL_BASE="https://github.com/${{ github.repository_owner }}/rocknix/releases/download/ashell-aarch64-${{ env.DEVICE }}"
          curl -L --fail --silent --show-error "${URL_BASE}/${ASSET}" -o "${ASSET}"
          # Exclude the toolchain Python installation to avoid stdlib / ABI
          # mismatches that break meson. The host Python and meson from the
          # toolchain must not be overwritten by ashell-deps.
          tar --zstd -xf "${ASSET}" \
            --exclude="./build.ROCKNIX-${DEVICE}.aarch64/toolchain/lib/libpython3.13*" \
            --exclude="./build.ROCKNIX-${DEVICE}.aarch64/toolchain/lib/python3.13" \
            --exclude="./build.ROCKNIX-${DEVICE}.aarch64/toolchain/bin/python3*" \
            --exclude="./build.ROCKNIX-${DEVICE}.aarch64/toolchain/bin/meson" \
            --exclude="./build.ROCKNIX-${DEVICE}.aarch64/toolchain/share/man/man1/python3.13.1"
          rm -f "${ASSET}"

      - name: Build wayvnc dependencies
        run: |
          ./scripts/get_env > .env
          (
            while true; do
              sleep 300
              ELAPSED_MIN=$((SECONDS / 60))
              ELAPSED_SEC=$((SECONDS % 60))
              echo "[heartbeat] $(date -Iseconds) | elapsed: ${ELAPSED_MIN}m${ELAPSED_SEC}s"
            done
          ) &
          HEARTBEAT_PID=$!
          set -e
          {
            echo 'set -e'
            echo 'for pkg in zlib libpng pixman aml libjpeg-turbo gmp nettle gnutls libdrm ffmpeg neatvnc jansson; do'
            echo '  echo "=== Building $pkg ==="'
            echo '  ./scripts/build "$pkg":target'
            echo 'done'
          } > build-deps.sh
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix "ghcr.io/rocknix/rocknix-build:latest" \
            bash /work/rocknix/build-deps.sh; echo $? > docker_exit_code; } | tee output.log | grep -E --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          rm -f build-deps.sh
          kill $HEARTBEAT_PID 2>/dev/null || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ env.DEVICE }}-aarch64-wayvnc-deps)
          path: |
            output.log
            ./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          if command -v ccache &> /dev/null; then
            ccache -s -v
            ccache -M 4G
            ccache -c
            ccache -s -v
            ccache -z
          else
            echo "ccache not found, skipping cleanup"
          fi

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ env.DEVICE }}-wayvnc-deps-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compress wayvnc-deps
        run: |
          # Identify host toolchain files/symlinks newly added by the dependency build.
          find "build.ROCKNIX-${{ env.DEVICE }}.aarch64/toolchain" \( -type f -o -type l \) | \
            LC_ALL=C sort > toolchain-after.txt
          LC_ALL=C comm -13 toolchain-before.txt toolchain-after.txt > toolchain-added.txt

          # Package target sysroot, stamps, and the added host toolchain files.
          tar --zstd -cf wayvnc-deps.tar.zst \
            ./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.stamps/ \
            ./build.ROCKNIX-${{ env.DEVICE }}.aarch64/toolchain/aarch64-rocknix-linux-gnu/sysroot/ \
            -T toolchain-added.txt

          rm -f toolchain-before.txt toolchain-after.txt toolchain-added.txt

      - name: Upload cache key
        run: |
          ASSET="wayvnc-deps-aarch64-${{ env.DEVICE }}.tar.zst"
          echo "${ASSET}" > wayvnc-deps-key.txt
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-wayvnc-deps (${{ env.DEVICE }})
          path: wayvnc-deps-key.txt
          if-no-files-found: error

      - name: Upload prebuilt wayvnc-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="wayvnc-deps-aarch64-${{ env.DEVICE }}.tar.zst"
          mv wayvnc-deps.tar.zst "${ASSET}"
          gh release create "wayvnc-aarch64-${{ env.DEVICE }}" --title "wayvnc for ${{ env.DEVICE }}" --notes "Cross-compiled wayvnc and dependencies for ROCKNIX ${{ env.DEVICE }}." --prerelease || true
          gh release upload "wayvnc-aarch64-${{ env.DEVICE }}" "${ASSET}" --clobber || echo "Upload failed: ${ASSET}, continuing..."
