name: Build aarch64

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      MODULES_PKG: no
      JAVA_HOME: /usr
      AUTOREMOVE: "yes"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compute aarch64 key
        id: aarch64_key
        run: |
          KEY=$(find packages projects/${{ inputs.PROJECT }} config distributions -type f -print0 | sort -z | xargs -0 cat | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Retrieve prebuilt aarch64
        id: aarch64_hit
        run: |
          KEY="${{ steps.aarch64_key.outputs.key }}"
          ASSET="aarch64-${{ inputs.DEVICE }}-${KEY}.tar.zst"
          PART_A="${ASSET}.aa"
          PART_B="${ASSET}.ab"
          PART_C="${ASSET}.ac"
          PART_D="${ASSET}.ad"
          PART_E="${ASSET}.ae"
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/aarch64-${{ inputs.DEVICE }}"
          if curl -L --fail --silent --show-error "${URL_BASE}/${PART_A}" -o "${PART_A}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_B}" -o "${PART_B}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_C}" -o "${PART_C}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_D}" -o "${PART_D}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_E}" -o "${PART_E}"; then
            cat "${PART_A}" "${PART_B}" "${PART_C}" "${PART_D}" "${PART_E}" > "${ASSET}"
            rm -f "${PART_A}" "${PART_B}" "${PART_C}" "${PART_D}" "${PART_E}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "Prebuilt aarch64 downloaded and extracted."
          else
            rm -f "${PART_A}" "${PART_B}" "${PART_C}" "${PART_D}" "${PART_E}" "${ASSET}"

            # Try partial cache from previous failed build
            PARTIAL_ASSET="aarch64-${{ inputs.DEVICE }}-${KEY}-partial.tar.zst"
            PARTIAL_PART_A="${PARTIAL_ASSET}.aa"
            PARTIAL_PART_B="${PARTIAL_ASSET}.ab"
            PARTIAL_PART_C="${PARTIAL_ASSET}.ac"
            PARTIAL_PART_D="${PARTIAL_ASSET}.ad"
            PARTIAL_PART_E="${PARTIAL_ASSET}.ae"
            if curl -L --fail --silent --show-error "${URL_BASE}/${PARTIAL_PART_A}" -o "${PARTIAL_PART_A}" && \
               curl -L --fail --silent --show-error "${URL_BASE}/${PARTIAL_PART_B}" -o "${PARTIAL_PART_B}" && \
               curl -L --fail --silent --show-error "${URL_BASE}/${PARTIAL_PART_C}" -o "${PARTIAL_PART_C}" && \
               curl -L --fail --silent --show-error "${URL_BASE}/${PARTIAL_PART_D}" -o "${PARTIAL_PART_D}" && \
               curl -L --fail --silent --show-error "${URL_BASE}/${PARTIAL_PART_E}" -o "${PARTIAL_PART_E}"; then
              cat "${PARTIAL_PART_A}" "${PARTIAL_PART_B}" "${PARTIAL_PART_C}" "${PARTIAL_PART_D}" "${PARTIAL_PART_E}" > "${PARTIAL_ASSET}"
              rm -f "${PARTIAL_PART_A}" "${PARTIAL_PART_B}" "${PARTIAL_PART_C}" "${PARTIAL_PART_D}" "${PARTIAL_PART_E}"
              tar --zstd -xf "${PARTIAL_ASSET}"
              rm -f "${PARTIAL_ASSET}"
              echo "hit=partial" >> $GITHUB_OUTPUT
              echo "Partial cache downloaded, will continue building."
            else
              rm -f "${PARTIAL_PART_A}" "${PARTIAL_PART_B}" "${PARTIAL_PART_C}" "${PARTIAL_PART_D}" "${PARTIAL_PART_E}" "${PARTIAL_ASSET}"
              echo "hit=false" >> $GITHUB_OUTPUT
              echo "Prebuilt aarch64 not found, will build from source."
            fi
          fi

      - name: Restore ccache
        if: steps.aarch64_hit.outputs.hit != 'true'
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-base-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ inputs.DEVICE }}-base-

      - name: Download aarch64-toolchain (${{ inputs.DEVICE }})
        if: steps.aarch64_hit.outputs.hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-toolchain
        if: steps.aarch64_hit.outputs.hit != 'true'
        run: |
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/toolchain-aarch64-${{ inputs.DEVICE }}"
          PARTS=()
          while IFS= read -r fname; do
            [ -n "$fname" ] || continue
            curl -L --fail --silent --show-error "${URL_BASE}/${fname}" -o "${fname}"
            PARTS+=("$fname")
          done < toolchain-key.txt
          if [ ${#PARTS[@]} -eq 1 ]; then
            ASSET="${PARTS[0]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          else
            ASSET="${PARTS[0]%.aa}"
            cat "${PARTS[@]}" > "${ASSET}"
            rm -f "${PARTS[@]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          fi

      - name: Build
        id: build_step
        if: steps.aarch64_hit.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          ./scripts/get_env > .env
          # Heartbeat: keep GitHub from killing us during long silent builds
          (
            while true; do
              sleep 300
              ELAPSED_MIN=$((SECONDS / 60))
              ELAPSED_SEC=$((SECONDS % 60))
              echo "[heartbeat] $(date -Iseconds) | elapsed: ${ELAPSED_MIN}m${ELAPSED_SEC}s"
            done
          ) &
          HEARTBEAT_PID=$!
          # Checkpoint: save partial cache every 2 hours in case runner is lost
          (
            KEY="${{ steps.aarch64_key.outputs.key }}"
            ASSET="aarch64-${{ inputs.DEVICE }}-${KEY}-partial.tar.zst"
            RELEASE_TAG="aarch64-${{ inputs.DEVICE }}"
            sleep 3600
            while true; do
              echo "[checkpoint] Creating partial cache at $(date -Iseconds)"
              tar --zstd --exclude='./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache' -cf "${ASSET}" ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/ 2>/dev/null || true
              split -n 5 "${ASSET}" "${ASSET}." 2>/dev/null || true
              rm -f "${ASSET}"
              gh release create "${RELEASE_TAG}" --title "AArch64 cache for ${{ inputs.DEVICE }}" --notes "Auto-generated aarch64 cache" --prerelease --repo weihuoya/rocknix || true
              gh release upload "${RELEASE_TAG}" "${ASSET}.aa" --clobber --repo weihuoya/rocknix || true
              gh release upload "${RELEASE_TAG}" "${ASSET}.ab" --clobber --repo weihuoya/rocknix || true
              gh release upload "${RELEASE_TAG}" "${ASSET}.ac" --clobber --repo weihuoya/rocknix || true
              gh release upload "${RELEASE_TAG}" "${ASSET}.ad" --clobber --repo weihuoya/rocknix || true
              gh release upload "${RELEASE_TAG}" "${ASSET}.ae" --clobber --repo weihuoya/rocknix || true
              rm -f "${ASSET}."*
              sleep 3600
            done
          ) &
          CHECKPOINT_PID=$!
          set -e
          { docker run --init --env-file .env --rm \
            --memory=14g --memory-swap=22g \
            --user $(id -u):$(id -g) \
            -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix \
            "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/build_distro"; echo $? > docker_exit_code; } | tee output.log | grep -E --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          kill $HEARTBEAT_PID 2>/dev/null || true
          kill $CHECKPOINT_PID 2>/dev/null || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-aarch64
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Clean ccache
        if: steps.aarch64_hit.outputs.hit != 'true'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          if command -v ccache &> /dev/null; then
            ccache -s -v
            ccache -M 6G
            ccache -c
            ccache -s -v
            ccache -z
          else
            echo "ccache not found, skipping cleanup"
          fi

      - name: Save ccache
        if: always() && steps.aarch64_hit.outputs.hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-base-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print space
        run: df -h

      - name: Upload prebuilt aarch64
        if: steps.aarch64_hit.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          KEY="${{ steps.aarch64_key.outputs.key }}"
          ASSET="aarch64-${{ inputs.DEVICE }}-${KEY}.tar.zst"
          tar --zstd --exclude='./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache' -cf "${ASSET}" ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/
          split -n 5 "${ASSET}" "${ASSET}."
          rm -f "${ASSET}"
          RELEASE_TAG="aarch64-${{ inputs.DEVICE }}"
          gh release create "${RELEASE_TAG}" --title "AArch64 cache for ${{ inputs.DEVICE }}" --notes "Auto-generated aarch64 cache" --prerelease --repo weihuoya/rocknix || true
          gh release upload "${RELEASE_TAG}" "${ASSET}.aa" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.aa, continuing..."
          gh release upload "${RELEASE_TAG}" "${ASSET}.ab" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ab, continuing..."
          gh release upload "${RELEASE_TAG}" "${ASSET}.ac" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ac, continuing..."
          gh release upload "${RELEASE_TAG}" "${ASSET}.ad" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ad, continuing..."
          gh release upload "${RELEASE_TAG}" "${ASSET}.ae" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ae, continuing..."

          # Delete partial cache since full cache is now available
          PARTIAL_ASSET="aarch64-${{ inputs.DEVICE }}-${KEY}-partial.tar.zst"
          gh release delete-asset "${RELEASE_TAG}" "${PARTIAL_ASSET}.aa" --repo weihuoya/rocknix || true
          gh release delete-asset "${RELEASE_TAG}" "${PARTIAL_ASSET}.ab" --repo weihuoya/rocknix || true
          gh release delete-asset "${RELEASE_TAG}" "${PARTIAL_ASSET}.ac" --repo weihuoya/rocknix || true
          gh release delete-asset "${RELEASE_TAG}" "${PARTIAL_ASSET}.ad" --repo weihuoya/rocknix || true
          gh release delete-asset "${RELEASE_TAG}" "${PARTIAL_ASSET}.ae" --repo weihuoya/rocknix || true

      - name: Upload partial prebuilt aarch64
        if: failure() && steps.build_step.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          KEY="${{ steps.aarch64_key.outputs.key }}"
          ASSET="aarch64-${{ inputs.DEVICE }}-${KEY}-partial.tar.zst"
          tar --zstd --exclude='./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache' -cf "${ASSET}" ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/
          split -n 5 "${ASSET}" "${ASSET}."
          rm -f "${ASSET}"
          RELEASE_TAG="aarch64-${{ inputs.DEVICE }}"
          gh release create "${RELEASE_TAG}" --title "AArch64 cache for ${{ inputs.DEVICE }}" --notes "Auto-generated aarch64 cache" --prerelease --repo weihuoya/rocknix || true
          gh release upload "${RELEASE_TAG}" "${ASSET}.aa" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.aa, continuing..."
          gh release upload "${RELEASE_TAG}" "${ASSET}.ab" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ab, continuing..."
          gh release upload "${RELEASE_TAG}" "${ASSET}.ac" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ac, continuing..."
          gh release upload "${RELEASE_TAG}" "${ASSET}.ad" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ad, continuing..."
          gh release upload "${RELEASE_TAG}" "${ASSET}.ae" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ae, continuing..."

      - name: Upload cache key
        run: |
          ASSET="aarch64-${{ inputs.DEVICE }}-${{ steps.aarch64_key.outputs.key }}.tar.zst"
          echo "${ASSET}.aa" > aarch64-key.txt
          echo "${ASSET}.ab" >> aarch64-key.txt
          echo "${ASSET}.ac" >> aarch64-key.txt
          echo "${ASSET}.ad" >> aarch64-key.txt
          echo "${ASSET}.ae" >> aarch64-key.txt
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 (${{ inputs.DEVICE }})
          path: aarch64-key.txt
          if-no-files-found: error

      - name: Upload new sources to mirror
        if: always() && steps.aarch64_hit.outputs.hit != 'true'
        env:
          GITHUB_API_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          if [ -f sources/.upload_sources ]; then
            ./scripts/upload_sources
          fi


