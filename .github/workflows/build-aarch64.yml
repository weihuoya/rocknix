name: Build aarch64

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      MODULES_PKG: no
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: false
          root-reserve-mb: 6144
          swap-size-mb: 8192
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-base-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ inputs.DEVICE }}-base-

      - name: Compute aarch64 key
        id: aarch64_key
        run: |
          KEY=$(find packages projects/${{ inputs.PROJECT }} config distributions -type f -print0 | sort -z | xargs -0 cat | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Retrieve prebuilt aarch64
        id: aarch64_hit
        run: |
          ASSET="aarch64-${{ inputs.DEVICE }}-${{ steps.aarch64_key.outputs.key }}.tar.zst"
          PART_A="${ASSET}.aa"
          PART_B="${ASSET}.ab"
          PART_C="${ASSET}.ac"
          PART_D="${ASSET}.ad"
          PART_E="${ASSET}.ae"
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/aarch64-${{ inputs.DEVICE }}"
          if curl -L --fail --silent --show-error "${URL_BASE}/${PART_A}" -o "${PART_A}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_B}" -o "${PART_B}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_C}" -o "${PART_C}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_D}" -o "${PART_D}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_E}" -o "${PART_E}"; then
            cat "${PART_A}" "${PART_B}" "${PART_C}" "${PART_D}" "${PART_E}" > "${ASSET}"
            rm -f "${PART_A}" "${PART_B}" "${PART_C}" "${PART_D}" "${PART_E}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "Prebuilt aarch64 downloaded and extracted."
          else
            rm -f "${PART_A}" "${PART_B}" "${PART_C}" "${PART_D}" "${PART_E}" "${ASSET}"
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "Prebuilt aarch64 not found, will build from source."
          fi

      - name: Download aarch64-toolchain (${{ inputs.DEVICE }})
        if: steps.aarch64_hit.outputs.hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-toolchain
        if: steps.aarch64_hit.outputs.hit != 'true'
        run: |
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/toolchain-aarch64-${{ inputs.DEVICE }}"
          PARTS=()
          while IFS= read -r fname; do
            [ -n "$fname" ] || continue
            curl -L --fail --silent --show-error "${URL_BASE}/${fname}" -o "${fname}"
            PARTS+=("$fname")
          done < toolchain-key.txt
          if [ ${#PARTS[@]} -eq 1 ]; then
            ASSET="${PARTS[0]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          else
            ASSET="${PARTS[0]%.aa}"
            cat "${PARTS[@]}" > "${ASSET}"
            rm -f "${PARTS[@]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          fi

      - name: Build
        if: steps.aarch64_hit.outputs.hit != 'true'
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_distro "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          working_directory: ${{ github.workspace }}
          max_attempts: 3
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-aarch64
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Clean ccache
        if: steps.aarch64_hit.outputs.hit != 'true'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          if command -v ccache &> /dev/null; then
            ccache -s -v
            ccache -M 6G
            ccache -c
            ccache -s -v
            ccache -z
          else
            echo "ccache not found, skipping cleanup"
          fi

      - name: Save ccache
        if: always() && steps.aarch64_hit.outputs.hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-base-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print space
        run: df -h

      - name: Upload prebuilt aarch64
        if: steps.aarch64_hit.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          ASSET="aarch64-${{ inputs.DEVICE }}-${{ steps.aarch64_key.outputs.key }}.tar.zst"
          tar --zstd --exclude='./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache' -cf "${ASSET}" ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/
          split -n 5 "${ASSET}" "${ASSET}."
          rm -f "${ASSET}"
          gh release create "aarch64-${{ inputs.DEVICE }}" --title "AArch64 cache for ${{ inputs.DEVICE }}" --notes "Auto-generated aarch64 cache" --prerelease --repo weihuoya/rocknix || true
          gh release upload "aarch64-${{ inputs.DEVICE }}" "${ASSET}.aa" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.aa, continuing..."
          gh release upload "aarch64-${{ inputs.DEVICE }}" "${ASSET}.ab" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ab, continuing..."
          gh release upload "aarch64-${{ inputs.DEVICE }}" "${ASSET}.ac" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ac, continuing..."
          gh release upload "aarch64-${{ inputs.DEVICE }}" "${ASSET}.ad" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ad, continuing..."
          gh release upload "aarch64-${{ inputs.DEVICE }}" "${ASSET}.ae" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ae, continuing..."

      - name: Upload cache key
        run: |
          ASSET="aarch64-${{ inputs.DEVICE }}-${{ steps.aarch64_key.outputs.key }}.tar.zst"
          echo "${ASSET}.aa" > aarch64-key.txt
          echo "${ASSET}.ab" >> aarch64-key.txt
          echo "${ASSET}.ac" >> aarch64-key.txt
          echo "${ASSET}.ad" >> aarch64-key.txt
          echo "${ASSET}.ae" >> aarch64-key.txt
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 (${{ inputs.DEVICE }})
          path: aarch64-key.txt
          if-no-files-found: error

      - name: Upload new sources to mirror
        if: always()
        env:
          GITHUB_API_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          if [ -f sources/.upload_sources ]; then
            ./scripts/upload_sources
          fi


