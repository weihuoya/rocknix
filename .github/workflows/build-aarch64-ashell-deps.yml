name: Build aarch64 ashell-deps cache for SM8550

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      DEVICE:
        required: false
        type: string
        default: 'SM8550'
      skip_toolchain:
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'packages/wayland/**/package.mk'
      - 'packages/wayland/libxkbcommon/**/package.mk'
      - 'packages/graphics/vulkan/**/package.mk'
      - 'packages/print/freetype/**/package.mk'
      - 'packages/x11/other/fontconfig/**/package.mk'
      - 'packages/graphics/harfbuzz/**/package.mk'
      - 'packages/x11/lib/libxcb/**/package.mk'
      - 'packages/x11/lib/libX*/**/package.mk'
      - 'projects/ROCKNIX/packages/**/package.mk'

jobs:
  build-aarch64-toolchain:
    if: ${{ !inputs.skip_toolchain }}
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/build-aarch64-toolchain.yml
    with:
      PROJECT: ROCKNIX
      DEVICE: ${{ inputs.DEVICE || 'SM8550' }}
      OWNER_LC: rocknix

  build-aarch64-ashell-deps:
    runs-on: ubuntu-24.04
    needs: build-aarch64-toolchain
    if: ${{ !cancelled() && (inputs.skip_toolchain || needs.build-aarch64-toolchain.result == 'success') }}
    permissions:
      actions: write
      contents: write
    env:
      JAVA_HOME: /usr
      PROJECT: ROCKNIX
      DEVICE: ${{ inputs.DEVICE || 'SM8550' }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Retrieve prebuilt ashell-deps
        id: deps_hit
        run: |
          ASSET="deps-aarch64-${{ env.DEVICE }}.tar.zst"
          URL_BASE="https://github.com/${{ github.repository_owner }}/rocknix/releases/download/ashell-aarch64-${{ env.DEVICE }}"
          if curl -L --fail --silent --show-error "${URL_BASE}/${ASSET}" -o "${ASSET}"; then
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "Prebuilt ashell-deps downloaded and extracted."
          else
            rm -f "${ASSET}"
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "Prebuilt ashell-deps not found, will build from source."
          fi

      - name: Restore ccache
        if: steps.deps_hit.outputs.hit != 'true'
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ env.DEVICE }}-ashell-deps-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ env.DEVICE }}-ashell-deps-

      - name: Download aarch64-toolchain key
        if: steps.deps_hit.outputs.hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain (${{ env.DEVICE }})

      - name: Download and extract aarch64-toolchain
        if: steps.deps_hit.outputs.hit != 'true'
        run: |
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/toolchain-aarch64-${{ env.DEVICE }}"
          PARTS=()
          while IFS= read -r fname; do
            [ -n "$fname" ] || continue
            curl -L --fail --silent --show-error "${URL_BASE}/${fname}" -o "${fname}"
            PARTS+=("$fname")
          done < toolchain-key.txt
          ASSET="${PARTS[0]%.aa}"
          cat "${PARTS[@]}" > "${ASSET}"
          rm -f "${PARTS[@]}" toolchain-key.txt
          tar --zstd -xf "${ASSET}"
          rm -f "${ASSET}"

      - name: Snapshot host toolchain before build
        if: steps.deps_hit.outputs.hit != 'true'
        run: |
          # The deps cache must include host toolchain artifacts installed by
          # :host packages (e.g. wayland-scanner, expat:host, libffi:host) so
          # that downstream ashell builds can reuse them. Record the set of
          # files/symlinks present before building, then package only the newly
          # added paths afterwards.
          find "build.ROCKNIX-${{ env.DEVICE }}.aarch64/toolchain" \( -type f -o -type l \) | \
            LC_ALL=C sort > toolchain-before.txt

      - name: Build ashell dependencies
        if: steps.deps_hit.outputs.hit != 'true'
        run: |
          ./scripts/get_env > .env
          (
            while true; do
              sleep 300
              ELAPSED_MIN=$((SECONDS / 60))
              ELAPSED_SEC=$((SECONDS % 60))
              echo "[heartbeat] $(date -Iseconds) | elapsed: ${ELAPSED_MIN}m${ELAPSED_SEC}s"
            done
          ) &
          HEARTBEAT_PID=$!
          set -e
          {
            echo 'set -e'
            echo 'for pkg in wayland wayland-protocols libxkbcommon vulkan-headers vulkan-loader fontconfig freetype harfbuzz libxcb libX11 libXcursor libXrandr libXi libXinerama libXrender libXext libXfixes libXau; do'
            echo '  echo "=== Building $pkg ==="'
            echo '  ./scripts/build "$pkg":target'
            echo 'done'
          } > build-deps.sh
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix "ghcr.io/rocknix/rocknix-build:latest" \
            bash /work/rocknix/build-deps.sh; echo $? > docker_exit_code; } | tee output.log | grep -E --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          rm -f build-deps.sh
          kill $HEARTBEAT_PID 2>/dev/null || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ env.DEVICE }}-aarch64-ashell-deps)
          path: |
            output.log
            ./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        if: steps.deps_hit.outputs.hit != 'true'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          if command -v ccache &> /dev/null; then
            ccache -s -v
            ccache -M 4G
            ccache -c
            ccache -s -v
            ccache -z
          else
            echo "ccache not found, skipping cleanup"
          fi

      - name: Save ccache
        if: always() && steps.deps_hit.outputs.hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ env.DEVICE }}-ashell-deps-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compress ashell-deps
        if: steps.deps_hit.outputs.hit != 'true'
        run: |
          # Identify host toolchain files/symlinks newly added by the dependency build.
          find "build.ROCKNIX-${{ env.DEVICE }}.aarch64/toolchain" \( -type f -o -type l \) | \
            LC_ALL=C sort > toolchain-after.txt
          LC_ALL=C comm -13 toolchain-before.txt toolchain-after.txt > toolchain-added.txt

          # Package target sysroot, stamps, and the added host toolchain files.
          tar --zstd -cf ashell-deps.tar.zst \
            ./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.stamps/ \
            ./build.ROCKNIX-${{ env.DEVICE }}.aarch64/toolchain/aarch64-rocknix-linux-gnu/sysroot/ \
            -T toolchain-added.txt

          rm -f toolchain-before.txt toolchain-after.txt toolchain-added.txt

      - name: Upload cache key
        run: |
          ASSET="deps-aarch64-${{ env.DEVICE }}.tar.zst"
          echo "${ASSET}" > ashell-deps-key.txt
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-ashell-deps (${{ env.DEVICE }})
          path: ashell-deps-key.txt
          if-no-files-found: error

      - name: Upload prebuilt ashell-deps
        if: steps.deps_hit.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="deps-aarch64-${{ env.DEVICE }}.tar.zst"
          mv ashell-deps.tar.zst "${ASSET}"
          gh release create "ashell-aarch64-${{ env.DEVICE }}" --title "ashell for ${{ env.DEVICE }}" --notes "Cross-compiled ashell and dependency cache for ROCKNIX ${{ env.DEVICE }}." --prerelease || true
          gh release upload "ashell-aarch64-${{ env.DEVICE }}" "${ASSET}" --clobber || echo "Upload failed: ${ASSET}, continuing..."
