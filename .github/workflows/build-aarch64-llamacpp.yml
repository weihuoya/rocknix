name: Build llama.cpp for SM8550

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: 'ROCKNIX device to build for'
        required: false
        type: string
        default: 'SM8550'
      REF:
        description: 'llama.cpp branch or tag to build'
        required: false
        type: string
        default: 'master'
  workflow_call:
    inputs:
      DEVICE:
        required: false
        type: string
        default: 'SM8550'
      REF:
        required: false
        type: string
        default: 'master'

jobs:
  build-aarch64-llamacpp:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      DEVICE: ${{ inputs.DEVICE || 'SM8550' }}
      REF: ${{ inputs.REF || 'master' }}
      ARCH: aarch64
      DISABLE_COLORS: yes
    steps:
      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch "${REF}" https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp rev-parse --short HEAD

      # 上游 skel 把 HTP 电压角锁 VCORNER_MAX,SM8550 满载会触发 PMIC 级整机复位。
      # 本分支实验:改用高通 GenieX 的 llama-hexagon-power-mode.patch(8 档电源档位,
      # 非 burst 档开 DCVS、区间投票,运行时经 GGML_HEXAGON_POWER_MODE 选择),
      # 补丁已把默认档烘为 power_saver(SVS~SVS+)以防裸奔复位;
      # 另含 DCVS_v2 实验槽位 dcvs2nomp/dcvs2turbo(仿 QNN 投票形态)。
      # 打不上必须 fail,不能放出未打补丁的构建。
      - name: Apply Qualcomm power-mode patch
        run: |
          cat > /tmp/llama-hexagon-power-mode.patch <<'EOF'
          diff --git a/ggml/src/ggml-hexagon/ggml-hexagon.cpp b/ggml/src/ggml-hexagon/ggml-hexagon.cpp
          index f3ca731..e7f10ff 100644
          --- a/ggml/src/ggml-hexagon/ggml-hexagon.cpp
          +++ b/ggml/src/ggml-hexagon/ggml-hexagon.cpp
          @@ -106,6 +106,43 @@ static int    opt_etm     = 0;
           static int    opt_verbose = 0;
           static int    opt_profile = 0; // profiling mode (0-disabled, 1-basic, 2-pmu)
           static bool   opt_hostbuf = false;
          +static int    opt_power_mode = HTP_POWER_MODE_POWER_SAVER; // DCVS/HMX power profile requested at session start (SM8550: BURST/MAX 会整机复位,默认 power_saver)
          +
          +static const std::pair<const char *, int> htp_power_mode_names[] = {
          +    { "low_power_saver",            HTP_POWER_MODE_LOW_POWER_SAVER },
          +    { "power_saver",                HTP_POWER_MODE_POWER_SAVER },
          +    { "high_power_saver",           HTP_POWER_MODE_HIGH_POWER_SAVER },
          +    { "low_balanced",               HTP_POWER_MODE_LOW_BALANCED },
          +    { "balanced",                   HTP_POWER_MODE_BALANCED },
          +    { "high_performance",           HTP_POWER_MODE_HIGH_PERFORMANCE },
          +    { "sustained_high_performance", HTP_POWER_MODE_SUSTAINED_HIGH_PERFORMANCE },
          +    { "burst",                      HTP_POWER_MODE_BURST },
          +    { "dcvs2nomp",                  HTP_POWER_MODE_DCVS2_NOMP },
          +    { "dcvs2turbo",                 HTP_POWER_MODE_DCVS2_TURBO },
          +    { "default",                    HTP_POWER_MODE_POWER_SAVER }, // flip this to change the default mode
          +};
          +
          +static int htp_power_mode_from_str(const char * s) {
          +    for (auto & e : htp_power_mode_names) {
          +#if defined(_MSC_VER)
          +        if (_stricmp(s, e.first) == 0) {
          +#else
          +        if (strcasecmp(s, e.first) == 0) {
          +#endif
          +            return e.second;
          +        }
          +    }
          +    return -1;
          +}
          +
          +static const char * htp_power_mode_to_str(int mode) {
          +    for (auto & e : htp_power_mode_names) {
          +        if (e.second == mode) {
          +            return e.first;
          +        }
          +    }
          +    return "unknown";
          +}
           static bool   opt_dma64   = false;

           static size_t opt_mbuf_dyn    = 512ul * 1024 * 1024;      // max dynamic (compute) buffer size
          @@ -4969,12 +5006,13 @@ void ggml_hexagon_session::allocate(const ggml_hexagon_device_config & config) n
               this->op_batch = new ggml_hexagon_opbatch(this, opt_opbatch, this->max_vmem);

               // Start dspqueue/opbatch processing
          -    err = htp_iface_start(this->handle, this->session_id, this->queue_id, this->n_threads, opt_nhmx, this->max_vmem);
          +    err = htp_iface_start(this->handle, this->session_id, this->queue_id, this->n_threads, opt_nhmx, this->max_vmem, (uint32_t) opt_power_mode);
               if (err != 0) {
                   GGML_LOG_ERROR("ggml-hex: %s failed to start session: 0x%08x\n", this->c_name(), (unsigned) err);
                   throw std::runtime_error("ggml-hex: iface start failed (see log for details)");
               }
               this->valid_iface = true;
          +    GGML_LOG_INFO("ggml-hex: %s power mode: %s\n", this->c_name(), htp_power_mode_to_str(opt_power_mode));

               if (opt_profile) {
                   htp_iface_pmu_conf pmu_conf{};
          @@ -9469,6 +9507,7 @@ static void ggml_hexagon_init(ggml_backend_reg * reg) {
               const char * str_optrace  = getenv("GGML_HEXAGON_OPTRACE");
               const char * str_hostbuf  = getenv("GGML_HEXAGON_HOSTBUF");
               const char * str_dma64    = getenv("GGML_HEXAGON_DMA64");
          +    const char * str_power_mode = getenv("GGML_HEXAGON_POWER_MODE");

               // Init Arch first since it affects other defaults
               if (!str_arch) {
          @@ -9509,6 +9548,14 @@ static void ggml_hexagon_init(ggml_backend_reg * reg) {
               opt_opfusion  = str_opfusion ? atoi(str_opfusion)                     : opt_opfusion;
               opt_profile   = str_profile  ? atoi(str_profile)                      : 0;
               opt_etm       = str_etm      ? atoi(str_etm)                          : 0;
          +    if (str_power_mode) {
          +        int m = htp_power_mode_from_str(str_power_mode);
          +        if (m < 0) {
          +            GGML_LOG_WARN("ggml-hex: unknown GGML_HEXAGON_POWER_MODE '%s', falling back to 'power_saver'\n", str_power_mode);
          +        } else {
          +            opt_power_mode = m;
          +        }
          +    }
               opt_nhvx      = str_nhvx     ? strtoul(str_nhvx, NULL, 0)             : opt_nhvx;
               opt_nhmx      = str_nhmx     ? atoi(str_nhmx)                         : opt_nhmx;
               opt_mm_select = str_mm_select ? atoi(str_mm_select)                   : opt_mm_select;
          diff --git a/ggml/src/ggml-hexagon/htp/htp-ops.h b/ggml/src/ggml-hexagon/htp/htp-ops.h
          index 5d2571f..551c5ae 100644
          --- a/ggml/src/ggml-hexagon/htp/htp-ops.h
          +++ b/ggml/src/ggml-hexagon/htp/htp-ops.h
          @@ -196,6 +196,26 @@ enum htp_profiler_mode {
               HTP_PROF_TRACE    = 3,
           };

          +// DCVS/HMX power profile requested for the session.
          +enum htp_power_mode {
          +    HTP_POWER_MODE_LOW_POWER_SAVER            = 0,
          +    HTP_POWER_MODE_POWER_SAVER                = 1,
          +    HTP_POWER_MODE_HIGH_POWER_SAVER           = 2,
          +    HTP_POWER_MODE_LOW_BALANCED               = 3,
          +    HTP_POWER_MODE_BALANCED                   = 4,
          +    HTP_POWER_MODE_HIGH_PERFORMANCE           = 5,
          +    HTP_POWER_MODE_SUSTAINED_HIGH_PERFORMANCE = 6,
          +    HTP_POWER_MODE_BURST                      = 7,
          +
          +    // DCVS_v2 投票形态实验槽位(仿 QNN,不走 v3 档位表)
          +    HTP_POWER_MODE_DCVS2_NOMP                 = 8,  // core SVS..NOM+, HMX SVS_L2
          +    HTP_POWER_MODE_DCVS2_TURBO                = 9,  // core SVS..TURBO, HMX NOM
          +
          +    HTP_POWER_MODE_COUNT,
          +
          +    HTP_POWER_MODE_DCVS2_BASE = HTP_POWER_MODE_DCVS2_NOMP
          +};
          +
           enum htp_trace_event_id {
               HTP_TRACE_EVT_DMA                 = 0,
               HTP_TRACE_EVT_L2FLUSH             = 1,
          diff --git a/ggml/src/ggml-hexagon/htp/htp_iface.idl b/ggml/src/ggml-hexagon/htp/htp_iface.idl
          index b46e252..303dbfb 100644
          --- a/ggml/src/ggml-hexagon/htp/htp_iface.idl
          +++ b/ggml/src/ggml-hexagon/htp/htp_iface.idl
          @@ -11,7 +11,7 @@ struct htp_iface_pmu_conf {
           };

           interface htp_iface : remote_handle64 {
          -    AEEResult start(in uint32 sess_id, in uint64 dsp_queue_id, in uint32 n_hvx, in uint32 n_hmx, in uint64 max_vmem);
          +    AEEResult start(in uint32 sess_id, in uint64 dsp_queue_id, in uint32 n_hvx, in uint32 n_hmx, in uint64 max_vmem, in uint32 power_mode);
               AEEResult stop();
               AEEResult mmap(in uint32 fd, in uint64 size);
               AEEResult munmap(in uint32 fd);
          diff --git a/ggml/src/ggml-hexagon/htp/main.c b/ggml/src/ggml-hexagon/htp/main.c
          index 2dd1b3f..33659b8 100644
          --- a/ggml/src/ggml-hexagon/htp/main.c
          +++ b/ggml/src/ggml-hexagon/htp/main.c
          @@ -363,12 +363,90 @@ static void htp_main_thread(void * context);
           static void htp_packet_callback(dspqueue_t queue, int error, void * context);
           static void htp_error_callback(dspqueue_t queue, int error, void * context);

          -AEEResult htp_iface_start(remote_handle64 handle, uint32_t sess_id, uint64_t dsp_queue_id, uint32_t n_hvx, uint32_t n_hmx, uint64_t max_vmem) {
          +// Non-BURST modes leave DCVS enabled and sleep allowed so the HTP can back off
          +// under thermal pressure. BURST pins all corners to MAX and disables both.
          +// Corner constants are from HAP_power.h (HAP_dcvs_voltage_corner_t / HAP_dcvs_exp_vcorner_t).
          +struct htp_power_profile {
          +    boolean  dcvs_enable;
          +    uint32_t bus_min_corner;
          +    uint32_t bus_max_corner;
          +    uint32_t bus_target_corner;
          +    uint32_t core_min_corner;
          +    uint32_t core_max_corner;
          +    uint32_t core_target_corner;
          +    boolean  sleep_disable;
          +    uint32_t hmx_min_corner;    // only used when __HVX_ARCH__ >= 75
          +    uint32_t hmx_max_corner;
          +    uint32_t hmx_target_corner;
          +    uint32_t hmx_perf_mode;
          +};
          +
          +#define HTP_POWER_PROFILE_ENTRY(min_c, max_c, hmx_c) \
          +    { \
          +        .dcvs_enable        = TRUE, \
          +        .bus_min_corner     = (min_c), \
          +        .bus_max_corner     = (max_c), \
          +        .bus_target_corner  = (max_c), \
          +        .core_min_corner    = (min_c), \
          +        .core_max_corner    = (max_c), \
          +        .core_target_corner = (max_c), \
          +        .sleep_disable      = TRUE, \
          +        .hmx_min_corner     = (hmx_c), \
          +        .hmx_max_corner     = (hmx_c), \
          +        .hmx_target_corner  = (hmx_c), \
          +        .hmx_perf_mode      = HAP_CLK_PERF_HIGH, \
          +    }
          +
          +static const struct htp_power_profile htp_power_profiles[HTP_POWER_MODE_COUNT] = {
          +    [HTP_POWER_MODE_LOW_POWER_SAVER] =
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS2, HAP_DCVS_VCORNER_SVS2, HAP_DCVS_EXP_VCORNER_MIN_SVS),
          +    [HTP_POWER_MODE_POWER_SAVER] =
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS, HAP_DCVS_VCORNER_SVS_PLUS, HAP_DCVS_EXP_VCORNER_SVS),
          +    [HTP_POWER_MODE_HIGH_POWER_SAVER] =
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS_PLUS, HAP_DCVS_VCORNER_NOM, HAP_DCVS_EXP_VCORNER_SVS_L2),
          +    [HTP_POWER_MODE_LOW_BALANCED] =   /* SM8550 钳位:原值 NOM..NOM+ 实测整机复位 */
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS_PLUS, HAP_DCVS_VCORNER_NOM, HAP_DCVS_EXP_VCORNER_SVS_L2),
          +    [HTP_POWER_MODE_BALANCED] =   /* SM8550 钳位 */
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS_PLUS, HAP_DCVS_VCORNER_NOM, HAP_DCVS_EXP_VCORNER_SVS_L2),
          +    [HTP_POWER_MODE_HIGH_PERFORMANCE] =   /* SM8550 钳位 */
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS_PLUS, HAP_DCVS_VCORNER_NOM, HAP_DCVS_EXP_VCORNER_SVS_L2),
          +    [HTP_POWER_MODE_SUSTAINED_HIGH_PERFORMANCE] =   /* SM8550 钳位 */
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS_PLUS, HAP_DCVS_VCORNER_NOM, HAP_DCVS_EXP_VCORNER_SVS_L2),
          +    [HTP_POWER_MODE_BURST] =   /* SM8550 钳位:锁 MAX 实测整机复位,与 sustained 同值 */
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS_PLUS, HAP_DCVS_VCORNER_NOM, HAP_DCVS_EXP_VCORNER_SVS_L2),
          +};
          +
          +// DCVS_v2 实验槽位的档位(复用同一结构;core min/target/max 映射 dcvs_params)
          +static const struct htp_power_profile htp_dcvs2_profiles[] = {
          +    [HTP_POWER_MODE_DCVS2_NOMP  - HTP_POWER_MODE_DCVS2_BASE] =
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS, HAP_DCVS_VCORNER_NOM_PLUS, HAP_DCVS_EXP_VCORNER_SVS_L2),
          +    [HTP_POWER_MODE_DCVS2_TURBO - HTP_POWER_MODE_DCVS2_BASE] =
          +        HTP_POWER_PROFILE_ENTRY(HAP_DCVS_VCORNER_SVS, HAP_DCVS_VCORNER_TURBO, HAP_DCVS_EXP_VCORNER_NOM),
          +};
          +
          +#undef HTP_POWER_PROFILE_ENTRY
          +
          +AEEResult htp_iface_start(remote_handle64 handle, uint32_t sess_id, uint64_t dsp_queue_id, uint32_t n_hvx, uint32_t n_hmx, uint64_t max_vmem, uint32_t power_mode) {
               struct htp_handle * h = (struct htp_handle *) handle;
               if (!h) {
                   return AEE_EBADPARM;
               }

          +    if (power_mode >= HTP_POWER_MODE_COUNT) {
          +        FARF(ERROR, "invalid power-mode %u, falling back to burst", (unsigned) power_mode);
          +        power_mode = HTP_POWER_MODE_BURST;
          +    }
          +    const boolean use_dcvs_v2 = (power_mode >= HTP_POWER_MODE_DCVS2_BASE);
          +    const struct htp_power_profile * pwr =
          +        use_dcvs_v2 ? &htp_dcvs2_profiles[power_mode - HTP_POWER_MODE_DCVS2_BASE]
          +                    : &htp_power_profiles[power_mode];
          +    FARF(ALWAYS, "power-mode %u : dcvs-enable %d bus[%u,%u,%u] core[%u,%u,%u] sleep-disable %d hmx[%u,%u,%u]",
          +         (unsigned) power_mode, (int) pwr->dcvs_enable,
          +         (unsigned) pwr->bus_min_corner, (unsigned) pwr->bus_max_corner, (unsigned) pwr->bus_target_corner,
          +         (unsigned) pwr->core_min_corner, (unsigned) pwr->core_max_corner, (unsigned) pwr->core_target_corner,
          +         (int) pwr->sleep_disable,
          +         (unsigned) pwr->hmx_min_corner, (unsigned) pwr->hmx_max_corner, (unsigned) pwr->hmx_target_corner);
          +
               if (h->ctx) {
                   FARF(ERROR, "Queue already open");
                   return AEE_EITEMBUSY;
          @@ -497,23 +575,36 @@ AEEResult htp_iface_start(remote_handle64 handle, uint32_t sess_id, uint64_t dsp
                   HAP_power_request_t request;
                   memset(&request, 0, sizeof(request));

          -        request.type                              = HAP_power_set_DCVS_v3;
          -        request.dcvs_v3.set_dcvs_enable           = TRUE;
          -        request.dcvs_v3.dcvs_enable               = FALSE;
          -        request.dcvs_v3.set_bus_params            = TRUE;
          -        request.dcvs_v3.bus_params.min_corner     = HAP_DCVS_VCORNER_MAX;
          -        request.dcvs_v3.bus_params.max_corner     = HAP_DCVS_VCORNER_MAX;
          -        request.dcvs_v3.bus_params.target_corner  = HAP_DCVS_VCORNER_MAX;
          -        request.dcvs_v3.set_core_params           = TRUE;
          -        request.dcvs_v3.core_params.min_corner    = HAP_DCVS_VCORNER_MAX;
          -        request.dcvs_v3.core_params.max_corner    = HAP_DCVS_VCORNER_MAX;
          -        request.dcvs_v3.core_params.target_corner = HAP_DCVS_VCORNER_MAX;
          -        request.dcvs_v3.set_sleep_disable         = TRUE;
          -        request.dcvs_v3.sleep_disable             = TRUE;
          +        if (use_dcvs_v2) {
          +            // 仿 QNN 的 DCVS_v2 投票形态(SM8550 实测 v3 冲 NOM+ 即整机复位,QNN v2 高档稳定)
          +            request.type                         = HAP_power_set_DCVS_v2;
          +            request.dcvs_v2.dcvs_enable          = pwr->dcvs_enable;
          +            request.dcvs_v2.dcvs_option          = HAP_DCVS_V2_ADJUST_UP_DOWN;
          +            request.dcvs_v2.set_latency          = TRUE;
          +            request.dcvs_v2.latency              = 40;
          +            request.dcvs_v2.set_dcvs_params      = TRUE;
          +            request.dcvs_v2.dcvs_params.min_corner    = pwr->core_min_corner;
          +            request.dcvs_v2.dcvs_params.target_corner = pwr->core_target_corner;
          +            request.dcvs_v2.dcvs_params.max_corner    = pwr->core_max_corner;
          +        } else {
          +            request.type                              = HAP_power_set_DCVS_v3;
          +            request.dcvs_v3.set_dcvs_enable           = TRUE;
          +            request.dcvs_v3.dcvs_enable               = pwr->dcvs_enable;
          +            request.dcvs_v3.set_bus_params            = TRUE;
          +            request.dcvs_v3.bus_params.min_corner     = pwr->bus_min_corner;
          +            request.dcvs_v3.bus_params.max_corner     = pwr->bus_max_corner;
          +            request.dcvs_v3.bus_params.target_corner  = pwr->bus_target_corner;
          +            request.dcvs_v3.set_core_params           = TRUE;
          +            request.dcvs_v3.core_params.min_corner    = pwr->core_min_corner;
          +            request.dcvs_v3.core_params.max_corner    = pwr->core_max_corner;
          +            request.dcvs_v3.core_params.target_corner = pwr->core_target_corner;
          +            request.dcvs_v3.set_sleep_disable         = TRUE;
          +            request.dcvs_v3.sleep_disable             = pwr->sleep_disable;

           #if (__HEXAGON_ARCH__ >= 79)
          -        HAP_set_dcvs_v3_protected_bus_corners(&request, 1);
          +            HAP_set_dcvs_v3_protected_bus_corners(&request, 1);
           #endif
          +        }
                   if ((err = HAP_power_set((void *) ctx, &request)) != 0) {
                       htp_iface_stop(handle);
                       return err;
          @@ -537,10 +628,10 @@ AEEResult htp_iface_start(remote_handle64 handle, uint32_t sess_id, uint64_t dsp
                   request.hmx_v2.set_power     = TRUE;
                   request.hmx_v2.power_up      = TRUE;
                   request.hmx_v2.set_clock     = TRUE;
          -        request.hmx_v2.target_corner = HAP_DCVS_EXP_VCORNER_MAX;
          -        request.hmx_v2.min_corner    = HAP_DCVS_EXP_VCORNER_MAX;
          -        request.hmx_v2.max_corner    = HAP_DCVS_EXP_VCORNER_MAX;
          -        request.hmx_v2.perf_mode     = HAP_CLK_PERF_HIGH;
          +        request.hmx_v2.target_corner = pwr->hmx_target_corner;
          +        request.hmx_v2.min_corner    = pwr->hmx_min_corner;
          +        request.hmx_v2.max_corner    = pwr->hmx_max_corner;
          +        request.hmx_v2.perf_mode     = pwr->hmx_perf_mode;
                   FARF(ALWAYS, "Setting HMX clock\n");
                   err = HAP_power_set((void *) ctx, &request);
                   if (err != AEE_SUCCESS) {
          EOF
          cd llama.cpp
          git apply --check /tmp/llama-hexagon-power-mode.patch || {
            echo "ERROR: llama-hexagon-power-mode.patch 无法套用到 ${REF}。未打补丁的 skel 默认锁 MAX corner,SM8550 满载直接整机复位,构建中止。请按上游源码更新补丁内容。"
            exit 1
          }
          git apply /tmp/llama-hexagon-power-mode.patch
          grep -n 'opt_power_mode = HTP_POWER_MODE_' ggml/src/ggml-hexagon/ggml-hexagon.cpp | head -2
          grep -c 'HTP_POWER_MODE_COUNT' ggml/src/ggml-hexagon/htp/main.c

      # 在上游 snapdragon presets 基础上追加 arm64-linux-snapdragon-vulkan-release
      # (继承 release,GGML_HEXAGON 继承为 ON,追加 GGML_VULKAN=ON + aarch64 链接件路径)
      - name: Generate CMakeUserPresets.json with Vulkan preset
        run: |
          python3 - <<'EOF'
          import json
          p = json.load(open('llama.cpp/docs/backend/snapdragon/CMakeUserPresets.json'))
          p['configurePresets'] = [x for x in p['configurePresets'] if x.get('name') != 'arm64-linux-snapdragon-vulkan-release']
          p['configurePresets'].append({
              "name": "arm64-linux-snapdragon-vulkan-release",
              "inherits": ["arm64-linux-snapdragon-release"],
              "cacheVariables": {
                  "GGML_VULKAN": "ON",
                  "Vulkan_LIBRARY": "/opt/vulkan-aarch64/lib/libvulkan.so"
              }
          })
          json.dump(p, open('llama.cpp/CMakeUserPresets.json', 'w'), indent=4)
          EOF

      # 官方工具链镜像(NDK + Hexagon SDK)不带 Vulkan 构建依赖;衍生层补 glslc/
      # spirv-headers/libvulkan-dev,并用 multiarch 的 libvulkan1:arm64 作为交叉链接件
      # (直接链接会错链镜像内 amd64 loader)
      - name: Build v0.7-vk toolchain image
        run: |
          mkdir vkbuild
          cat > vkbuild/Dockerfile <<'EOF'
          FROM ghcr.io/snapdragon-toolchain/arm64-linux:v0.7
          RUN dpkg --add-architecture arm64 \
           && apt-get update -qq \
           && apt-get install -y --no-install-recommends glslc spirv-headers libvulkan-dev \
           && cd /tmp \
           && apt-get download libvulkan1:arm64 \
           && dpkg -x libvulkan1_*_arm64.deb /tmp/vk \
           && mkdir -p /opt/vulkan-aarch64/lib \
           && cp -a /tmp/vk/usr/lib/aarch64-linux-gnu/libvulkan.so.1* /opt/vulkan-aarch64/lib/ \
           && ln -sf libvulkan.so.1 /opt/vulkan-aarch64/lib/libvulkan.so \
           && rm -rf /var/lib/apt/lists/* /tmp/libvulkan1_*_arm64.deb /tmp/vk
          EOF
          docker build -t ghcr.io/snapdragon-toolchain/arm64-linux:v0.7-vk vkbuild

      - name: Build llama.cpp (Hexagon + Vulkan)
        run: |
          cd llama.cpp
          python3 scripts/snapdragon/build.py --target lnx -j"$(nproc)" \
            --preset arm64-linux-snapdragon-vulkan-release \
            --toolchain-version v0.7-vk

      - name: Package llama.cpp
        run: |
          cd llama.cpp
          SHA=$(git rev-parse --short HEAD)
          for f in bin/llama-server bin/llama-cli bin/test-backend-ops \
                   lib/libggml-hexagon.so lib/libggml-htp-v73.so lib/libggml-vulkan.so; do
            [ -e "pkg-lnx/llama.cpp/$f" ] || { echo "ERROR: 缺产物 pkg-lnx/llama.cpp/$f,检查构建日志"; exit 1; }
          done
          STAGE="llamacpp-${{ env.DEVICE }}-${SHA}"
          tar -czf "${STAGE}.tar.gz" -C pkg-lnx llama.cpp
          ls -lh "${STAGE}.tar.gz"
          echo "ASSET=llama.cpp/${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload llama.cpp to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="llamacpp-aarch64-${{ env.DEVICE }}"
          gh release create "${RELEASE_TAG}" --repo "${{ github.repository }}" --title "llama.cpp for ${{ env.DEVICE }}" --notes "llama.cpp (Hexagon + Vulkan)" --prerelease || true
          gh release upload "${RELEASE_TAG}" "${{ env.ASSET }}" --clobber --repo "${{ github.repository }}"
