name: Build gcc-gdb for ROCKNIX aarch64
on:
  workflow_dispatch:
    inputs:
      DEVICE:
        required: false
        type: string
        default: 'SM8550'
  push:
    branches: [next]
    paths:
      - 'packages/lang/gcc-native/**'
      - 'packages/devel/gdb/**'
jobs:
  build-aarch64-gcc-gdb:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      JAVA_HOME: /usr
      PROJECT: ROCKNIX
      DEVICE: ${{ inputs.DEVICE || 'SM8550' }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ env.DEVICE }}-gcc-gdb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ env.DEVICE }}-gcc-gdb-
      - name: Download toolchain
        run: |
          ASSET="toolchain-aarch64-SM8550-2718568bd983a54f.tar.zst"
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/toolchain-aarch64-SM8550"
          curl -L --fail "${URL_BASE}/${ASSET}.aa" -o "${ASSET}.aa"
          curl -L --fail "${URL_BASE}/${ASSET}.ab" -o "${ASSET}.ab"
          cat "${ASSET}.aa" "${ASSET}.ab" > "${ASSET}"
          tar --zstd -xf "${ASSET}"
          rm -f "${ASSET}"*
      - name: Build gcc-native and gdb
        run: |
          ./scripts/get_env > .env
          set -e
          {
            echo 'set -e'
            echo 'echo "=== Building gmp (with CFLAGS cleared) ==="'
            echo 'CFLAGS="" CXXFLAGS="" ./scripts/build gmp:target'
            echo 'for pkg in mpfr mpc gcc-native gdb; do'
            echo '  echo "=== Building $pkg ==="'
            echo '  ./scripts/build "$pkg":target'
            echo 'done'
          } > build-gcc-gdb.sh
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix "ghcr.io/rocknix/rocknix-build:latest" \
            bash /work/rocknix/build-gcc-gdb.sh
          rm -f build-gcc-gdb.sh
      - name: Archive output.logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ env.DEVICE }}-aarch64-gcc-gdb)
          path: |
            output.log
            ./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.threads/logs/
      - name: Package gcc-gdb
        run: |
          tar --zstd -cf gcc-gdb-aarch64-${{ env.DEVICE }}.tar.zst \
            -C build.ROCKNIX-${{ env.DEVICE }}.aarch64/install_pkg \
            gcc-native gdb || echo "Package creation may have partial failures"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="gcc-gdb-aarch64-${{ env.DEVICE }}.tar.zst"
          gh release create "gcc-gdb-aarch64-${{ env.DEVICE }}" \
            --title "GCC/GDB for ${{ env.DEVICE }}" \
            --notes "Native GCC and GDB for ROCKNIX ${{ env.DEVICE }} aarch64." \
            --prerelease || true
          gh release upload "gcc-gdb-aarch64-${{ env.DEVICE }}" "${ASSET}" --clobber || true
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ env.DEVICE }}-gcc-gdb-${{ github.run_id }}-${{ github.run_attempt }}
