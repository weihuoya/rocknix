name: Build toolchain

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string

jobs:
  build-aarch64-toolchain:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      JAVA_HOME: /usr
      AUTOREMOVE: "yes"
      AUTOREMOVE_BLOCK: "gcc glibc libtool flex"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compute toolchain key
        id: toolchain_key
        run: |
          KEY=$(find packages/virtual/toolchain packages/lang/gcc packages/devel/binutils packages/devel/glibc packages/lang/llvm packages/devel/cmake packages/devel/make packages/devel/autoconf packages/devel/automake packages/devel/libtool packages/devel/flex packages/devel/bison packages/devel/patchelf packages/devel/pax-utils packages/compress/7-zip packages/devel/configtools -type f | sort | xargs cat | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Retrieve prebuilt toolchain
        id: toolchain_hit
        run: |
          ASSET="toolchain-aarch64-${{ inputs.DEVICE }}-${{ steps.toolchain_key.outputs.key }}.tar.zst"
          PART_A="${ASSET}.aa"
          PART_B="${ASSET}.ab"
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/toolchain-aarch64-${{ inputs.DEVICE }}"
          if curl -L --fail --silent --show-error "${URL_BASE}/${PART_A}" -o "${PART_A}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_B}" -o "${PART_B}"; then
            cat "${PART_A}" "${PART_B}" > "${ASSET}"
            rm -f "${PART_A}" "${PART_B}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "Prebuilt toolchain downloaded and extracted."
          else
            rm -f "${PART_A}" "${PART_B}" "${ASSET}"
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "Prebuilt toolchain not found, will build from source."
          fi

      - name: Restore ccache
        if: steps.toolchain_hit.outputs.hit != 'true'
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ inputs.DEVICE }}-toolchain-

      - name: Build
        if: steps.toolchain_hit.outputs.hit != 'true'
        run: |
          ./scripts/get_env > .env
          # Heartbeat: keep GitHub from killing us during long silent builds
          (
            while true; do
              sleep 300
              ELAPSED_MIN=$((SECONDS / 60))
              ELAPSED_SEC=$((SECONDS % 60))
              echo "[heartbeat] $(date -Iseconds) | elapsed: ${ELAPSED_MIN}m${ELAPSED_SEC}s"
            done
          ) &
          HEARTBEAT_PID=$!
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/build_mt toolchain alsa-lib llvm:host"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          kill $HEARTBEAT_PID 2>/dev/null || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Build llvm:target
        if: ${{ inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM8750' }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt llvm:target "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-llvm)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-llvm
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        if: steps.toolchain_hit.outputs.hit != 'true'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          if command -v ccache &> /dev/null; then
            ccache -s -v
            ccache -M 4G
            ccache -c
            ccache -s -v
            ccache -z
          else
            echo "ccache not found, skipping cleanup"
          fi

      - name: Save ccache
        if: always() && steps.toolchain_hit.outputs.hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-toolchain-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compress directory
        if: steps.toolchain_hit.outputs.hit != 'true'
        run: |
          tar --zstd -cf build.aarch64-toolchain.tar.zst \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps

      - name: Upload cache key
        run: |
          ASSET="toolchain-aarch64-${{ inputs.DEVICE }}-${{ steps.toolchain_key.outputs.key }}.tar.zst"
          echo "${ASSET}.aa" > toolchain-key.txt
          echo "${ASSET}.ab" >> toolchain-key.txt
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})
          path: toolchain-key.txt
          if-no-files-found: error

      - name: Upload prebuilt toolchain
        if: steps.toolchain_hit.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          ASSET="toolchain-aarch64-${{ inputs.DEVICE }}-${{ steps.toolchain_key.outputs.key }}.tar.zst"
          mv build.aarch64-toolchain.tar.zst "${ASSET}"
          split -n 2 "${ASSET}" "${ASSET}."
          rm -f "${ASSET}"
          gh release create "toolchain-aarch64-${{ inputs.DEVICE }}" --title "Toolchain cache for ${{ inputs.DEVICE }}" --notes "Auto-generated toolchain cache" --prerelease --repo weihuoya/rocknix || true
          gh release upload "toolchain-aarch64-${{ inputs.DEVICE }}" "${ASSET}.aa" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.aa, continuing..."
          gh release upload "toolchain-aarch64-${{ inputs.DEVICE }}" "${ASSET}.ab" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ab, continuing..."

      - name: Upload new sources to mirror
        if: always() && steps.toolchain_hit.outputs.hit != 'true'
        env:
          GITHUB_API_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          if [ -f sources/.upload_sources ]; then
            ./scripts/upload_sources
          fi
