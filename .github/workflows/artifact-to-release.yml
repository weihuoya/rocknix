name: Mirror Artifact to Release

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: 'GitHub Artifact URL (e.g. https://github.com/owner/repo/actions/runs/123/artifacts/456)'
        required: true
        type: string
      release_tag:
        description: 'Target release tag to upload to'
        required: true
        default: 'artifacts'
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Parse artifact URL
        id: parse
        run: |
          URL="${{ inputs.artifact_url }}"
          if [[ "$URL" =~ github.com/([^/]+)/([^/]+)/actions/runs/[0-9]+/artifacts/([0-9]+) ]]; then
            echo "owner=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "repo=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "artifact_id=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported artifact URL format: $URL"
            exit 1
          fi

      - name: Fetch artifact metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ steps.parse.outputs.owner }}"
          REPO="${{ steps.parse.outputs.repo }}"
          ARTIFACT_ID="${{ steps.parse.outputs.artifact_id }}"

          JSON=$(gh api "repos/${OWNER}/${REPO}/actions/artifacts/${ARTIFACT_ID}")
          ARTIFACT_NAME=$(echo "$JSON" | jq -r '.name')
          ARCHIVE_URL=$(echo "$JSON" | jq -r '.archive_download_url')
          EXPIRED=$(echo "$JSON" | jq -r '.expired')

          if [ "$EXPIRED" = "true" ]; then
            echo "Artifact is expired."
            exit 1
          fi

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_url=${ARCHIVE_URL}" >> "$GITHUB_OUTPUT"

      - name: Ensure target release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "${{ inputs.release_tag }}" --title "Artifact Mirror" --notes "Mirrored artifacts from slow GitHub Artifact storage." --repo "${{ github.repository }}" || true

      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE_URL="${{ steps.meta.outputs.archive_url }}"
          ARTIFACT_NAME="${{ steps.meta.outputs.artifact_name }}"
          echo "Downloading ${ARTIFACT_NAME}..."
          gh api "${ARCHIVE_URL}" > "${ARTIFACT_NAME}.zip"
          ls -lh "${ARTIFACT_NAME}.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="${{ steps.meta.outputs.artifact_name }}"
          echo "Uploading ${ARTIFACT_NAME}.zip to release ${{ inputs.release_tag }}..."
          gh release upload "${{ inputs.release_tag }}" "${ARTIFACT_NAME}.zip" --clobber --repo "${{ github.repository }}"
          echo "Done: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}"
