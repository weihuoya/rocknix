name: Build image

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true

jobs:
  build-aarch64-image:
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CHEEVOS_DEV_LOGIN: ${{ secrets.CHEEVOS_DEV_LOGIN }}
      GAMESDB_APIKEY: ${{ secrets.GAMESDB_APIKEY }}
      SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      ENABLE_32BIT: no
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-image-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ inputs.DEVICE }}-image-
            ccache-aarch64-${{ inputs.DEVICE }}-base-
            ccache-aarch64-${{ inputs.DEVICE }}-emu-standalone-
            ccache-aarch64-${{ inputs.DEVICE }}-emu-libretro-

      - name: Download aarch64 (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64 (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64
        run: |
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/aarch64-${{ inputs.DEVICE }}"
          PARTS=()
          while IFS= read -r fname; do
            [ -n "$fname" ] || continue
            curl -L --fail --silent --show-error "${URL_BASE}/${fname}" -o "${fname}"
            PARTS+=("$fname")
          done < aarch64-key.txt
          if [ ${#PARTS[@]} -eq 1 ]; then
            ASSET="${PARTS[0]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          else
            ASSET="${PARTS[0]%.aa}"
            cat "${PARTS[@]}" > "${ASSET}"
            rm -f "${PARTS[@]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          fi

      - name: Download emu-libretro (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-libretro (${{ inputs.DEVICE }})

      - name: Extract artifact emu-libretro
        run: |
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/emu-libretro-aarch64-${{ inputs.DEVICE }}"
          PARTS=()
          while IFS= read -r fname; do
            [ -n "$fname" ] || continue
            curl -L --fail --silent --show-error "${URL_BASE}/${fname}" -o "${fname}"
            PARTS+=("$fname")
          done < emu-libretro-key.txt
          if [ ${#PARTS[@]} -eq 1 ]; then
            ASSET="${PARTS[0]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          else
            ASSET="${PARTS[0]%.aa}"
            cat "${PARTS[@]}" > "${ASSET}"
            rm -f "${PARTS[@]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          fi

      - name: Download emu-standalone (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: emu-standalone (${{ inputs.DEVICE }})

      - name: Extract artifact emu-standalone
        run: |
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/emu-standalone-aarch64-${{ inputs.DEVICE }}"
          PARTS=()
          while IFS= read -r fname; do
            [ -n "$fname" ] || continue
            curl -L --fail --silent --show-error "${URL_BASE}/${fname}" -o "${fname}"
            PARTS+=("$fname")
          done < emu-standalone-key.txt
          if [ ${#PARTS[@]} -eq 1 ]; then
            ASSET="${PARTS[0]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          else
            ASSET="${PARTS[0]%.aa}"
            cat "${PARTS[@]}" > "${ASSET}"
            rm -f "${PARTS[@]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          fi

      # clean to rebuild emulators and emulationstation with credentials / latest artifacts
      - name: Clean emulators and emulationstation
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/clean emulators && ./scripts/clean emulationstation"

      - name: build
        env:
          DIRTY: yes
        run: |
          ./scripts/get_env > .env
          # Heartbeat: keep GitHub from killing us during long silent builds
          (
            while true; do
              sleep 300
              ELAPSED_MIN=$((SECONDS / 60))
              ELAPSED_SEC=$((SECONDS % 60))
              echo "[heartbeat] $(date -Iseconds) | elapsed: ${ELAPSED_MIN}m${ELAPSED_SEC}s"
            done
          ) &
          HEARTBEAT_PID=$!
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/build_distro"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          kill $HEARTBEAT_PID 2>/dev/null || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-image)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-image)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          if command -v ccache &> /dev/null; then
            ccache -s -v
            ccache -M 4G
            ccache -c
            ccache -s -v
            ccache -z
          else
            echo "ccache not found, skipping cleanup"
          fi

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-image-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print space
        run: df -h

      - name: Upload image to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" target/ROCKNIX-*.img.gz target/ROCKNIX-*.img.gz.sha256 --clobber --repo ${{ github.repository }}

      - name: Upload update to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" target/ROCKNIX-*.tar target/ROCKNIX-*.tar.sha256 --clobber --repo ${{ github.repository }}
