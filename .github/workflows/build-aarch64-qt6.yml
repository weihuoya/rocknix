name: Build qt6

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string

jobs:
  build-aarch64-qt6:
    runs-on: ubuntu-24.04
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      TARGET_TYPE: emus_only
      JAVA_HOME: /usr
      AUTOREMOVE: "yes"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compute qt6 key
        id: qt6_key
        run: |
          KEY=$(find projects/ROCKNIX/packages/graphics/qt6 -type f | sort | xargs cat | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Retrieve prebuilt qt6
        id: qt6_hit
        run: |
          ASSET="qt6-aarch64-${{ inputs.DEVICE }}-${{ steps.qt6_key.outputs.key }}.tar.zst"
          PART_A="${ASSET}.aa"
          PART_B="${ASSET}.ab"
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/qt6-aarch64-${{ inputs.DEVICE }}"
          if curl -L --fail --silent --show-error "${URL_BASE}/${PART_A}" -o "${PART_A}" && \
             curl -L --fail --silent --show-error "${URL_BASE}/${PART_B}" -o "${PART_B}"; then
            cat "${PART_A}" "${PART_B}" > "${ASSET}"
            rm -f "${PART_A}" "${PART_B}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "Prebuilt qt6 downloaded and extracted."
          else
            rm -f "${PART_A}" "${PART_B}" "${ASSET}"
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "Prebuilt qt6 not found, will build from source."
          fi

      - name: Restore ccache
        if: steps.qt6_hit.outputs.hit != 'true'
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-qt6-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ inputs.DEVICE }}-qt6-

      - name: Download aarch64 (${{ inputs.DEVICE }})
        if: steps.qt6_hit.outputs.hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: aarch64 (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64
        if: steps.qt6_hit.outputs.hit != 'true'
        run: |
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/aarch64-${{ inputs.DEVICE }}"
          PARTS=()
          while IFS= read -r fname; do
            [ -n "$fname" ] || continue
            curl -L --fail --silent --show-error "${URL_BASE}/${fname}" -o "${fname}"
            PARTS+=("$fname")
          done < aarch64-key.txt
          if [ ${#PARTS[@]} -eq 1 ]; then
            ASSET="${PARTS[0]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          else
            ASSET="${PARTS[0]%.aa}"
            cat "${PARTS[@]}" > "${ASSET}"
            rm -f "${PARTS[@]}"
            tar --zstd -xf "${ASSET}"
            rm -f "${ASSET}"
          fi

      - name: Build
        if: steps.qt6_hit.outputs.hit != 'true'
        run: |
          ./scripts/get_env > .env
          touch timestamp_before
          # Heartbeat: keep GitHub from killing us during long silent builds
          (
            while true; do
              sleep 300
              ELAPSED_MIN=$((SECONDS / 60))
              ELAPSED_SEC=$((SECONDS % 60))
              echo "[heartbeat] $(date -Iseconds) | elapsed: ${ELAPSED_MIN}m${ELAPSED_SEC}s"
            done
          ) &
          HEARTBEAT_PID=$!
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash -c "./scripts/build_mt qt6 modules"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          kill $HEARTBEAT_PID 2>/dev/null || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-qt6)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-qt6)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        if: steps.qt6_hit.outputs.hit != 'true'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          if command -v ccache &> /dev/null; then
            ccache -s -v
            ccache -M 4G
            ccache -c
            ccache -s -v
            ccache -z
          else
            echo "ccache not found, skipping cleanup"
          fi

      - name: Save ccache
        if: always() && steps.qt6_hit.outputs.hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ inputs.DEVICE }}-qt6-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compress directory
        if: steps.qt6_hit.outputs.hit != 'true'
        run: |
          tar --zstd --exclude='build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build' --exclude='build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache' -cf build.qt6.tar.zst \
          build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/

      - name: Upload cache key
        run: |
          ASSET="qt6-aarch64-${{ inputs.DEVICE }}-${{ steps.qt6_key.outputs.key }}.tar.zst"
          echo "${ASSET}.aa" > qt6-key.txt
          echo "${ASSET}.ab" >> qt6-key.txt
      - uses: actions/upload-artifact@v7
        with:
          name: qt6 (${{ inputs.DEVICE }})
          path: qt6-key.txt
          if-no-files-found: error

      - name: Upload prebuilt qt6
        if: steps.qt6_hit.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          ASSET="qt6-aarch64-${{ inputs.DEVICE }}-${{ steps.qt6_key.outputs.key }}.tar.zst"
          mv build.qt6.tar.zst "${ASSET}"
          split -n 2 "${ASSET}" "${ASSET}."
          rm -f "${ASSET}"
          gh release create "qt6-aarch64-${{ inputs.DEVICE }}" --title "Qt6 cache for ${{ inputs.DEVICE }}" --notes "Auto-generated qt6 cache" --prerelease --repo weihuoya/rocknix || true
          gh release upload "qt6-aarch64-${{ inputs.DEVICE }}" "${ASSET}.aa" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.aa, continuing..."
          gh release upload "qt6-aarch64-${{ inputs.DEVICE }}" "${ASSET}.ab" --clobber --repo weihuoya/rocknix || echo "Upload failed: ${ASSET}.ab, continuing..."

      - name: Upload new sources to mirror
        if: always() && steps.qt6_hit.outputs.hit != 'true'
        env:
          GITHUB_API_TOKEN: ${{ secrets.CACHE_REPO_TOKEN }}
        run: |
          if [ -f sources/.upload_sources ]; then
            ./scripts/upload_sources
          fi
