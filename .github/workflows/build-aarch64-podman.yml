name: Build podman container stack for SM8550

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-aarch64-podman:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      JAVA_HOME: /usr
      PROJECT: ROCKNIX
      DEVICE: SM8550
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ env.DEVICE }}-podman-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-aarch64-${{ env.DEVICE }}-podman-

      - name: Download and extract fixed aarch64-toolchain
        run: |
          ASSET="toolchain-aarch64-SM8550-e389816a1bf7a28f.tar.zst"
          URL_BASE="https://github.com/weihuoya/rocknix/releases/download/toolchain-aarch64-SM8550"
          curl -L --fail --silent --show-error "${URL_BASE}/${ASSET}.aa" -o "${ASSET}.aa"
          curl -L --fail --silent --show-error "${URL_BASE}/${ASSET}.ab" -o "${ASSET}.ab"
          cat "${ASSET}.aa" "${ASSET}.ab" > "${ASSET}"
          rm -f "${ASSET}.aa" "${ASSET}.ab"
          tar --zstd -xf "${ASSET}"
          rm -f "${ASSET}"

      - name: Build podman stack
        run: |
          ./scripts/get_env > .env
          (
            while true; do
              sleep 300
              ELAPSED_MIN=$((SECONDS / 60))
              ELAPSED_SEC=$((SECONDS % 60))
              echo "[heartbeat] $(date -Iseconds) | elapsed: ${ELAPSED_MIN}m${ELAPSED_SEC}s"
            done
          ) &
          HEARTBEAT_PID=$!
          set -e
          mkdir -p .ci-home .ci-gocache
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:/work/rocknix -w /work/rocknix -e PWD=/work/rocknix \
              -e HOME=/work/rocknix/.ci-home -e GOCACHE=/work/rocknix/.ci-gocache \
              "ghcr.io/rocknix/rocknix-build:latest" \
            bash -c "./scripts/build podman-bin:target conmon:target runc:target netavark:target fuse-overlayfs:target passt:target catatonit:target shadow:target attr-bin:target inotify-tools:target fuse3:target"; echo $? > docker_exit_code; } 2>&1 | tee output.log | grep -E --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          kill $HEARTBEAT_PID 2>/dev/null || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ env.DEVICE }}-aarch64-podman)
          path: |
            output.log
            ./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          if command -v ccache &> /dev/null; then
            ccache -s -v
            ccache -M 4G
            ccache -c
            ccache -s -v
            ccache -z
          else
            echo "ccache not found, skipping cleanup"
          fi

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build.ROCKNIX-${{ env.DEVICE }}.aarch64/.ccache
          key: ccache-aarch64-${{ env.DEVICE }}-podman-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package container stack
        run: |
          set -euo pipefail
          BUILD_DIR="build.ROCKNIX-${{ env.DEVICE }}.aarch64"
          PODMAN_VERSION=$(grep '^PKG_VERSION=' projects/ROCKNIX/packages/sysutils/podman-bin/package.mk | cut -d'"' -f2)
          STAGE="podman-stack-${{ env.DEVICE }}-${PODMAN_VERSION}"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"/{usr/bin,usr/libexec/podman,etc/containers}

          merge() {
            for d in "${BUILD_DIR}"/install_pkg/"$1"-*; do
              [ -d "$d" ] || continue
              cp -a "$d/." "${STAGE}/"
            done
          }

          merge conmon fuse-overlayfs passt catatonit shadow attr-bin inotify-tools fuse3

          # Go/Rust binaries are not installed by their package.mk; locate them
          find_bin() { find "${BUILD_DIR}" -type f -path "*$1*" -name "$2" | head -1; }

          PODMAN=$(find_bin podman-bin- bin/podman)
          PODMAN_REMOTE=$(find_bin podman-bin- bin/podman-remote)
          RUNC=$(find_bin runc- bin/runc)
          NETAVARK=$(find_bin netavark- netavark)
          for pair in "podman:${PODMAN}:usr/bin" "podman-remote:${PODMAN_REMOTE}:usr/bin" \
                      "runc:${RUNC}:usr/libexec/podman" "netavark:${NETAVARK}:usr/libexec/podman"; do
            name=${pair%%:*}; rest=${pair#*:}; src=${rest%:*}; dst=${rest##*:}
            [ -n "${src}" ] && [ -f "${src}" ] || { echo "ERROR: ${name} binary not found"; exit 1; }
            cp -a "${src}" "${STAGE}/${dst}/"
          done
          for helper in rootlessport quadlet; do
            src=$(find_bin podman-bin- "bin/${helper}")
            [ -n "${src}" ] && cp -a "${src}" "${STAGE}/usr/libexec/podman/"
          done
          if [ -f "${STAGE}/usr/bin/conmon" ]; then
            mv "${STAGE}/usr/bin/conmon" "${STAGE}/usr/libexec/podman/"
          fi

          # rootless defaults
          cat > "${STAGE}/etc/containers/storage.conf" <<'CONF'
          [storage]
          driver = "overlay"

          [storage.options.overlay]
          mount_program = "/usr/bin/fuse-overlayfs"
          CONF
          cat > "${STAGE}/etc/containers/containers.conf" <<'CONF'
          [engine]
          runtime = "runc"
          conmon_path = ["/usr/libexec/podman/conmon"]
          helper_binaries_dir = ["/usr/libexec/podman"]

          [network]
          default_network = "pasta"
          CONF
          cat > "${STAGE}/etc/containers/registries.conf" <<'CONF'
          unqualified-search-registries = ["docker.io"]
          CONF
          echo '{"default":[{"type":"insecureAcceptAnything"}]}' > "${STAGE}/etc/containers/policy.json"

          # trim build leftovers
          rm -rf "${STAGE}"/usr/include "${STAGE}"/usr/share "${STAGE}"/usr/lib/systemd \
                 "${STAGE}"/usr/lib/udev "${STAGE}"/usr/lib/pkgconfig
          find "${STAGE}" -name '*.a' -delete
          find "${STAGE}" -name '*.la' -delete

          for f in usr/bin/podman usr/bin/pasta usr/bin/fuse-overlayfs usr/bin/newuidmap \
                   usr/bin/setfattr usr/bin/inotifywait usr/libexec/podman/conmon \
                   usr/libexec/podman/runc usr/libexec/podman/netavark \
                   etc/containers/storage.conf; do
            [ -e "${STAGE}/${f}" ] || { echo "ERROR: ${f} missing"; exit 1; }
          done
          compgen -G "${STAGE}/usr/lib/libsubid.so*" > /dev/null || { echo "ERROR: libsubid missing"; exit 1; }

          # newuidmap/newgidmap must be setuid root in the image
          chmod 4755 "${STAGE}/usr/bin/newuidmap" "${STAGE}/usr/bin/newgidmap"

          tar --zstd -cf "${STAGE}.tar.zst" -C "${STAGE}" .
          sha256sum "${STAGE}.tar.zst" > "${STAGE}.tar.zst.sha256"
          ls -lh "${STAGE}.tar.zst"
          echo "ASSET=${STAGE}.tar.zst" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="podman-stack-aarch64-${{ env.DEVICE }}"
          gh release create "${RELEASE_TAG}" --title "podman stack for ${{ env.DEVICE }}" --notes "Rootless podman stack (podman 6.2.0, conmon, runc, netavark, fuse-overlayfs, pasta, catatonit, newuidmap/newgidmap, setfattr, inotifywait) for ROCKNIX ${{ env.DEVICE }}." --prerelease || true
          gh release upload "${RELEASE_TAG}" "${ASSET}" "${ASSET}.sha256" --clobber
