# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: AYANEO Pocket S 2K Layout

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket S 2K

single_source: false

source_devices:
  - group: gamepad
    evdev:
      vendor_id: "1c4f"
      product_id: "0002"
      handler: event*
    capability_map_id: ayaneo_mcu_xbox
  - group: gamepad
    evdev:
      vendor_id: "045e"
      product_id: "028e"
      handler: event*
    capability_map_id: ayaneo_mcu_xbox
  - group: keyboard
    evdev:
      name: aya-keys
      handler: event*
    capability_map_id: ayaneo_pocket_s2k_keys

options:
  auto_manage: true

# ds5-edge is needed for LeftPaddle/RightPaddle to reach evdev.
target_devices:
  - ds5-edge
  - keyboard
